# Builds the kaspa-even-odd Docker image, smoke-tests it, pushes the immutable
# sha-<commit> tag to ghcr.io, then bumps that tag into deploy/deployment.yaml
# and commits it back. Argo CD (oci-k3s-starter) syncs the cluster to Git, so
# `git push` to main is the deploy button. CI never talks to Kubernetes and
# no cluster credential exists here.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/kaspa-even-odd

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # lets CI commit the bumped image tag back to deploy/
      packages: write # lets GITHUB_TOKEN push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Tag with the commit SHA as well as `latest`. Deploy the SHA, not
          # `latest`: Kubernetes cannot tell that a moving tag changed, so
          # `latest` gives you a deployment that does not redeploy.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health endpoint
        run: |
          docker run --detach --rm --name kaspa-even-odd -p 3000:3000 \
            -e PORT=3000 -e GAME_STORE_PATH=/tmp/games.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${GITHUB_SHA}"
          trap 'docker stop kaspa-even-odd' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs kaspa-even-odd
          exit 1

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image
        if: github.event_name == 'push'
        run: docker image push --all-tags "${{ env.REGISTRY }}/${{ env.IMAGE }}"

      - name: Bump image tag in deploy manifest
        if: github.event_name == 'push'
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          sed -i "s|image: ghcr.io/${GITHUB_REPOSITORY}/kaspa-even-odd:.*|image: ghcr.io/${GITHUB_REPOSITORY}/kaspa-even-odd:${SHA_TAG}|" deploy/deployment.yaml
          if git diff --quiet deploy/deployment.yaml; then
            echo "manifest already points at ${SHA_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git commit -m "deploy: ${SHA_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"