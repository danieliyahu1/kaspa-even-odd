apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaspa-even-odd
  namespace: kaspa-even-odd
  labels:
    app.kubernetes.io/name: kaspa-even-odd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kaspa-even-odd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaspa-even-odd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kaspa-even-odd
          image: ghcr.io/OWNER/REPOSITORY/kaspa-even-odd:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
