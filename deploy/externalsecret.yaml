# Maps the OCI Vault entry holding the game-fee recipient into the
# `kaspa-even-odd-fee` Secret the Deployment reads. What is in Git is a NAME,
# never a value: the box proves its own identity (instance principal) to OCI
# and fetches the value at runtime.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaspa-even-odd-fee
  namespace: kaspa-even-odd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaspa-even-odd-fee
    creationPolicy: Owner
  data:
    - secretKey: address
      remoteRef:
        key: k3s-01-kaspa-even-odd-fee
---
# Maps the OCI Vault entries holding the Telegram feedback bot credentials into
# the `kaspa-even-odd-telegram` Secret the Deployment reads. Only the NAME is in
# Git: the token and chat id are fetched from the Vault at runtime and never
# appear in this repository or in browser code.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaspa-even-odd-telegram
  namespace: kaspa-even-odd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: kaspa-even-odd-telegram
    creationPolicy: Owner
  data:
    - secretKey: botToken
      remoteRef:
        key: k3s-01-kaspa-even-odd-telegram-bot-token
    - secretKey: chatId
      remoteRef:
        key: k3s-01-kaspa-even-odd-telegram-chat-id